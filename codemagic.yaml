# Codemagic CI/CD — Oyuncu Dükkanı iOS
# https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/

workflows:
  ios-testflight:
    name: iOS TestFlight (Otomatik)
    instance_type: mac_mini_m2
    max_build_duration: 60

    # Codemagic UI'da mevcut Apple Developer Portal entegrasyonunun ismi
    # (Personal Account → Settings → Integrations → Developer Portal → "Codemagic"
    #  Key: 2M84B256CL — Magnus için kurulmus, paylaşılan)
    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # ios_signing bloğu YOK — çünkü profil yoksa script'ten önce hata verir.
      # Signing tamamen scripts içinde "app-store-connect fetch-signing-files --create"
      # ile yapılıyor (profil yoksa OLUŞTURULUR).
      vars:
        APP_STORE_APP_ID: "6778437262"
        BUNDLE_ID: "com.oyuncudukkani.app"

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Fetch signing files (auto-create profile if missing)
        script: |
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Flutter packages
        script: |
          flutter --version
          flutter packages pub get
      - name: Pod install
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter build ipa
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID") + 1))
          flutter build ipa --release \
            --build-name=1.0.1 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        # Otomatik TestFlight yükleme (App Store onayı GEREKTİRMEZ — internal testing için)
        submit_to_testflight: true
        # App Store'a otomatik göndermek için TestFlight onayından sonra true yap:
        submit_to_app_store: false
