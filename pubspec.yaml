name: oyuncu_dukkani
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.2+13

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  audioplayers: ^6.6.0
  google_mobile_ads: ^5.3.1
  device_info_plus: ^11.2.0
  app_tracking_transparency: ^2.0.6+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  device_preview: ^1.2.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true  # Apple App Store şeffaflık (alpha kanal) kabul etmiyor
  image_path: "assets/oyuncu_dukkani_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/oyuncu_dukkani_icon.png"

